<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone check-in: medicines question</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Gloock&amp;display=swap">
<style>
body{margin:0}
a{color:#A80F55}a:hover{color:#8A0C46}
button{font-family:inherit}
</style>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;box-sizing:border-box;background:#0B4F54}
.phone{border-radius:36px;box-shadow:0 18px 50px rgba(30,27,58,.25)}
</style>
<style>
.glass{backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 22px 44px -20px rgba(122,22,66,.38),0 6px 14px -8px rgba(122,22,66,.20)}
.glass-dark{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 22px 44px -18px rgba(20,8,14,.55)}
.glass-thin{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 6px 16px -10px rgba(122,22,66,.35)}
.pill-glass{backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 18px -10px rgba(122,22,66,.40)}
.pill-solid{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 12px 22px -12px rgba(60,10,30,.65)}
.frost{backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4)}
.glass,.pill-glass,.pill-solid{transition:transform .18s ease,box-shadow .18s ease}
a.pill-glass:hover,button.pill-glass:hover,a.pill-solid:hover,button.pill-solid:hover,button.glass:hover{transform:translateY(-2px)}
@media (prefers-reduced-transparency: reduce){.glass,.pill-glass,.glass-thin,.frost{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background-color:#FFFFFF!important}}
@media (prefers-reduced-motion: reduce){.glass,.pill-glass,.pill-solid{transition:none}}
</style>
</head>
<body>
<div class="phone" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: radial-gradient(230px 200px at 104% 4%, rgba(18,143,152,0.55), transparent 70%), radial-gradient(300px 260px at 50% 40%, rgba(255,255,255,0.40), transparent 70%), radial-gradient(280px 240px at -6% 70%, rgba(211,21,107,0.26), transparent 70%), radial-gradient(220px 200px at 104% 104%, rgba(18,143,152,0.40), transparent 70%), #F1BFC1; color: #231F20; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 6px">
    <a class="pill-glass" href="04-phone-arrival.html" style="display: inline-flex; align-items: center; gap: 4px; height: 60px; padding: 0 16px 0 10px; border-radius: 999px; border: 2px solid #8C5560; background: rgba(255,255,255,0.62); color: #231F20; font-size: 19px; font-weight: 700; text-decoration: none; box-sizing: border-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Back
    </a>
    <div style="display: flex; gap: 8px">
      <button class="glass" style="width: 88px; height: 60px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 22px; border: 2px solid #8C5560; background: rgba(255,255,255,0.74); color: #231F20; cursor: pointer">
        <span aria-hidden="true" style="font-size: 16px; font-weight: 700; line-height: 1">A<span style="font-size: 24px">A</span></span>
        <span style="font-size: 15px; font-weight: 700">Text size</span>
      </button>
      <button class="glass" style="width: 88px; height: 60px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 22px; border: 2px solid #8C5560; background: rgba(255,255,255,0.74); color: #231F20; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"></path><path d="M15.5 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
        <span style="font-size: 15px; font-weight: 700">Read aloud</span>
      </button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 12px 24px 18px">
    <div>
      <p style="margin: 0; font-size: 17px; font-weight: 700; color: #5A3A42">Question 2 of 5</p>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; margin-top: 8px">
        <span style="height: 8px; border-radius: 999px; background: #D3156B"></span>
        <span style="height: 8px; border-radius: 999px; background: #0E7A82"></span>
        <span style="height: 8px; border-radius: 999px; background: #F7D7DA"></span>
        <span style="height: 8px; border-radius: 999px; background: #F7D7DA"></span>
        <span style="height: 8px; border-radius: 999px; background: #F7D7DA"></span>
      </div>
    </div>

    <div>
      <h1 id="q" style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.22">Do you know the names of the medicines you take?</h1>
      <p style="margin: 10px 0 0; font-size: 19px; line-height: 1.4; color: #4A3A3E">This helps us ask the next question the right way. There's no wrong answer.</p>
    </div>

    <nav aria-labelledby="q" style="display: flex; flex-direction: column; gap: 12px">
      <a class="pill-glass" href="07-phone-medical-terms.html" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px; border-radius: 999px; border: 2px solid #8C5560; background: rgba(255,255,255,0.62); color: #231F20; font-size: 21px; font-weight: 700; text-decoration: none; box-sizing: border-box">
        <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: #D2EEEF; color: #0B5C61; flex: 0 0 auto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        <span style="flex: 1">Yes, I know them</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E383E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
      <a class="pill-glass" href="06-phone-simple-words.html" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px; border-radius: 999px; border: 2px solid #8C5560; background: rgba(255,255,255,0.62); color: #231F20; font-size: 21px; font-weight: 700; text-decoration: none; box-sizing: border-box">
        <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: #FBE3C0; color: #6B4A0C; flex: 0 0 auto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"></path></svg></span>
        <span style="flex: 1">I know some of them</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E383E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
      <a class="pill-glass" href="06-phone-simple-words.html" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px; border-radius: 999px; border: 2px solid #8C5560; background: rgba(255,255,255,0.62); color: #231F20; font-size: 21px; font-weight: 700; text-decoration: none; box-sizing: border-box">
        <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: #FCE3EC; color: #A80F55; flex: 0 0 auto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"></path><path d="M12 17.5v.01"></path></svg></span>
        <span style="flex: 1">Not really</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E383E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
      <a class="pill-glass" href="08-phone-check-answers.html" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px; border-radius: 999px; border: 2px solid #8C5560; background: rgba(255,255,255,0.62); color: #231F20; font-size: 21px; font-weight: 700; text-decoration: none; box-sizing: border-box">
        <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: #F4E4E6; color: #4A3A3E; flex: 0 0 auto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"></circle><path d="M6.8 17.2L17.2 6.8"></path></svg></span>
        <span style="flex: 1">I don't take any</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E383E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </nav>
  </main>

  <div class="frost" style="padding: 12px 16px 18px; background: rgba(255,255,255,0.5); border-top: 1px solid rgba(255,255,255,0.75)">
    <a class="pill-glass" href="10-phone-help-requested.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; border-radius: 999px; border: 2px solid #231F20; background: rgba(255,255,255,0.62); color: #231F20; font-size: 20px; font-weight: 700; text-decoration: none; box-sizing: border-box">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"></circle><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"></path></svg>
      Get help from the desk
    </a>
  </div>
</div>
</body>
</html>
