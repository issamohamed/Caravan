<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Caravan mobile: simple words</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Gloock&amp;display=swap">
<style>
body{margin:0}
a{color:#A80F55}a:hover{color:#8A0C46}
button{font-family:inherit}
</style>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:24px 16px 32px;box-sizing:border-box;background:#0B4F54}
.phone{border-radius:36px;box-shadow:0 18px 50px rgba(30,27,58,.25)}
</style>
<style>
.dot{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;border:2px solid #8C5560;background:#fff;color:transparent;flex:0 0 auto;box-sizing:border-box}
.dot.on{background:#D3156B;border-color:#A80F55;color:#fff}
</style>
<style>
.glass{backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 22px 44px -20px rgba(122,22,66,.38),0 6px 14px -8px rgba(122,22,66,.20)}
.glass-dark{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 22px 44px -18px rgba(20,8,14,.55)}
.glass-thin{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 6px 16px -10px rgba(122,22,66,.35)}
.pill-glass{backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 18px -10px rgba(122,22,66,.40)}
.pill-solid{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 12px 22px -12px rgba(60,10,30,.65)}
.frost{backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4)}
.glass,.pill-glass,.pill-solid{transition:transform .18s ease,box-shadow .18s ease}
a.pill-glass:hover,button.pill-glass:hover,a.pill-solid:hover,button.pill-solid:hover,button.glass:hover{transform:translateY(-2px)}
@media (prefers-reduced-transparency: reduce){.glass,.pill-glass,.glass-thin,.frost{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background-color:#FFFFFF!important}}
@media (prefers-reduced-motion: reduce){.glass,.pill-glass,.pill-solid{transition:none}}
</style>
</head>
<body>
<div style="width: 390px; max-width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #FFFFFF; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif">
  <span style="font-size: 15px"><span style="font-family: 'Gloock', Georgia, serif; font-size: 21px">caravan<span style="color: #F48FB4">.</span></span> mobile · arrival check-in</span>
  <span style="padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,0.16); font-size: 13px; font-weight: 700; white-space: nowrap">3a · Simple words</span>
</div>
<div class="phone" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: radial-gradient(230px 200px at 104% 4%, rgba(18,143,152,0.55), transparent 70%), radial-gradient(300px 260px at 50% 40%, rgba(255,255,255,0.40), transparent 70%), radial-gradient(280px 240px at -6% 70%, rgba(211,21,107,0.26), transparent 70%), radial-gradient(220px 200px at 104% 104%, rgba(18,143,152,0.40), transparent 70%), #F1BFC1; color: #231F20; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 6px">
    <a class="pill-glass" href="mobile-02-medicines-question.html" style="display: inline-flex; align-items: center; gap: 4px; height: 60px; padding: 0 16px 0 10px; border-radius: 999px; border: 2px solid #8C5560; background: rgba(255,255,255,0.62); color: #231F20; font-size: 19px; font-weight: 700; text-decoration: none; box-sizing: border-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Back
    </a>
    <div style="display: flex; gap: 8px">
      <button class="glass" style="width: 88px; height: 60px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 22px; border: 2px solid #8C5560; background: rgba(255,255,255,0.74); color: #231F20; cursor: pointer">
        <span aria-hidden="true" style="font-size: 16px; font-weight: 700; line-height: 1">A<span style="font-size: 24px">A</span></span>
        <span style="font-size: 15px; font-weight: 700">Text size</span>
      </button>
      <button class="glass" style="width: 88px; height: 60px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 22px; border: 2px solid #8C5560; background: rgba(255,255,255,0.74); color: #231F20; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"></path><path d="M15.5 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
        <span style="font-size: 15px; font-weight: 700">Read aloud</span>
      </button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px 24px 14px">
    <div>
      <p style="margin: 0; font-size: 17px; font-weight: 700; color: #5A3A42">Question 3 of 5</p>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; margin-top: 8px">
        <span style="height: 8px; border-radius: 999px; background: #D3156B"></span>
        <span style="height: 8px; border-radius: 999px; background: #D3156B"></span>
        <span style="height: 8px; border-radius: 999px; background: #0E7A82"></span>
        <span style="height: 8px; border-radius: 999px; background: #F7D7DA"></span>
        <span style="height: 8px; border-radius: 999px; background: #F7D7DA"></span>
      </div>
    </div>

    <nav aria-label="Wording" style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 17px; font-weight: 700; color: #4A3A3E">Wording</span>
      <div class="glass-thin" style="flex: 1; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(247,211,214,0.6)">
        <span class="pill-solid" aria-current="true" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 999px; background: #231F20; color: #FFFFFF; font-size: 17px; font-weight: 700">Simple words</span>
        <a href="mobile-03b-medical-terms.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 999px; color: #231F20; font-size: 17px; font-weight: 700; text-decoration: none">Medical terms</a>
      </div>
    </nav>

    <div>
      <p style="margin: 0; font-size: 22px; font-weight: 700; color: #0B5C61">That's okay.</p>
      <h1 id="q" style="margin: 6px 0 0; font-size: 30px; font-weight: 700; line-height: 1.22">Did you bring your pill bottles or a list?</h1>
    </div>

    <div role="radiogroup" aria-labelledby="q" style="display: flex; flex-direction: column; gap: 10px">
      <button class="pill-glass" role="radio" aria-checked="false" data-choice="yes" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 0 16px; border-radius: 999px; border: 2px solid #8C5560; background: rgba(255,255,255,0.62); color: #231F20; font-size: 20px; font-weight: 700; text-align: left; cursor: pointer; box-sizing: border-box"><span class="dot" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>Yes, I brought them</span></button>
      <button class="pill-glass" role="radio" aria-checked="false" data-choice="no" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 0 16px; border-radius: 999px; border: 2px solid #8C5560; background: rgba(255,255,255,0.62); color: #231F20; font-size: 20px; font-weight: 700; text-align: left; cursor: pointer; box-sizing: border-box"><span class="dot" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>No, I didn't bring them</span></button>
      <button class="pill-glass" role="radio" aria-checked="false" data-choice="someone" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 0 16px; border-radius: 999px; border: 2px solid #8C5560; background: rgba(255,255,255,0.62); color: #231F20; font-size: 20px; font-weight: 700; text-align: left; cursor: pointer; box-sizing: border-box"><span class="dot" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>Someone with me has them</span></button>
    </div>

    <p class="glass" aria-live="polite" style="margin: 0; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 22px; background: rgba(210,238,239,0.9); color: #0B5C61; font-size: 18px; line-height: 1.35">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px"><path d="M12 20.5s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7.5 2.5c0 5.6-7.5 10-7.5 10z"></path></svg>
      <span id="reassure">Great. Keep them handy, and the nurse will look at them with you.</span>
    </p>

    <a class="pill-solid" href="mobile-04-check-answers.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; border-radius: 999px; background: #D3156B; color: #FFFFFF; font-size: 22px; font-weight: 700; text-decoration: none; box-sizing: border-box">
      Next
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </a>
  </main>

  <div class="frost" style="padding: 10px 16px 16px; background: rgba(255,255,255,0.5); border-top: 1px solid rgba(255,255,255,0.75)">
    <a class="pill-glass" href="mobile-06-help-requested.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 999px; border: 2px solid #231F20; background: rgba(255,255,255,0.62); color: #231F20; font-size: 20px; font-weight: 700; text-decoration: none; box-sizing: border-box">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"></circle><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"></path></svg>
      Get help from the desk
    </a>
  </div>
</div>
<script>
(function () {
  var msgs = {
    yes: 'Great. Keep them handy, and the nurse will look at them with you.',
    no: "That's fine. The nurse will go over your medicines with you.",
    someone: 'Good. Ask them to come in with you when your name is called.'
  };
  var btns = Array.prototype.slice.call(document.querySelectorAll('[data-choice]'));
  function pick(id) {
    btns.forEach(function (b) {
      var on = b.getAttribute('data-choice') === id;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.style.border = on ? '3px solid #A80F55' : '2px solid #8C5560';
      b.style.background = on ? 'rgba(252,227,236,0.88)' : 'rgba(255,255,255,0.62)';
      b.querySelector('.dot').className = on ? 'dot on' : 'dot';
    });
    document.getElementById('reassure').textContent = msgs[id];
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { pick(b.getAttribute('data-choice')); }); });
  pick('yes');
})();
</script>
</body>
</html>
